[workspace]
members = [
    "crates/paraegox",
    "crates/paraegox-fabric",
    "crates/paraegox-kernel",
    "crates/paraegox-node",
    "crates/paraegox-runtime",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
repository = "https://github.com/jsmy-CTH/Paraegox"

[workspace.dependencies]
async-trait = "0.1.89"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.47.1", default-features = false }
uuid = { version = "1.18.0", features = ["serde", "v4"] }
zenoh = { version = "=1.9.0", default-features = false, features = ["transport_tcp"] }

[workspace.lints.rust]
unsafe_code = "forbid"
