[workspace]
members = [
    "crates/paraegox",
    "crates/paraegox-agent",
    "crates/paraegox-deck",
    "crates/paraegox-fabric",
    "crates/paraegox-kernel",
    "crates/paraegox-node",
    "crates/paraegox-runtime",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
repository = "https://github.com/jsmy-CTH/Paraegox"

[workspace.dependencies]
async-trait = "0.1.89"
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures-util = "0.3.31"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
secrecy = "0.10.3"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
tokio = { version = "1.47.1", default-features = false }
uuid = { version = "1.18.0", features = ["serde", "v4"] }
zenoh = { version = "=1.9.0", default-features = false, features = ["transport_tcp"] }

[workspace.lints.rust]
unsafe_code = "forbid"
